<p-toast />

@if (!hasApiKey()) {
<main class="w-screen h-screen flex flex-col items-center justify-center gap-4">
    <h1 class="text-2xl font-bold mb-4">Insira sua API Key</h1>
    <input pInputText type="text" [(ngModel)]="apiKey" placeholder="API Key" />
    <button pButton (click)="onApiKeyChange()">Salvar</button>

    @if (!showApiKeyTutorial) {
    <section class="mt-4 text-center">
        <p class="mb-2">Não sabe onde obter sua API Key?</p>
        <button pButton (click)="showApiKeyTutorial = true">Clique aqui</button>
    </section>
    }

    <app-api-key-tutorial [class.hidden]="!showApiKeyTutorial" class="animate" (onApiKeyPasteEv)="apiKey = $event" />
</main>
} @else {
<button pButton (click)="clearApiKey()" class="fixed! top-0 right-0" size="small" severity="danger" outlined>
    Limpar API Key
</button>

<router-outlet />
}
